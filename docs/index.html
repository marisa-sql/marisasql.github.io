<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>MarisaBoard</title>

  <!-- Correct stylesheet link -->
  <link rel="stylesheet" href="style.css">
</head>

<body>
  <header class="topbar">
    <div class="wrap topbar-inner">
      <a class="brand" href="/">MarisaBoard</a>

      <nav class="nav">
        <a href="#sec">sec</a>
        <a href="#dev">dev</a>
        <a href="#ops">ops</a>
        <a href="#subscribe">Subscribe</a>
      </nav>
    </div>
  </header>

  <main class="wrap">
    <section class="hero">
      <p class="kicker">EDITORIAL IMAGEBOARD • TECH • SECURITY</p>
      <h1>Threads, but make it a publication.</h1>
      <p class="lede">Longform OP posts + fast replies + a clean catalog. Dark, chunky, modern.</p>

      <div class="subscribe" id="subscribe">
        <div>
          <strong>Get the dispatch</strong>
          <p>One email when something is worth reading. No spam.</p>
        </div>
        <a class="btn btn-accent" href="#subscribe">Subscribe</a>
      </div>
    </section>

    <section class="controls">
      <div class="tabs" role="tablist" aria-label="Catalog sorting">
        <button class="tab is-active" data-sort="bumped">Bumped</button>
        <button class="tab" data-sort="latest">Latest</button>
        <button class="tab" data-sort="pinned">Pinned</button>
      </div>

      <div class="search">
        <input id="q" type="search" placeholder="Search threads…" />
      </div>
    </section>

    <section class="catalog" id="catalog">
      <!-- JS injects thread cards -->
      <noscript>
        <p>Please enable JavaScript to view the catalog.</p>
      </noscript>
    </section>
  </main>

  <!-- Correct script tag -->
  <script src="app.js"></script>
</body>
</html>
