<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<title>Chunky Retro Blog</title>
<style>
  :root {
    --bg: #f5f5f5;
    --fg: #000;
    --accent: #ff00aa;
    --max: 760px;
  }
  body {
    background: var(--bg);
    color: var(--fg);
    font-family: system-ui, sans-serif;
    margin: 0;
    padding: 0;
  }
  header {
    border-bottom: 3px solid var(--fg);
    padding: 1.5rem 1rem;
    text-align: center;
  }
  header h1 {
    font-size: 3rem;
    font-weight: 900;
    margin: 0;
    letter-spacing: -1px;
  }
  nav {
    margin-top: .5rem;
    font-weight: bold;
  }
  nav a {
    margin: 0 .5rem;
    text-decoration: none;
    color: var(--fg);
  }
  nav a::after {
    content: "|";
    margin-left: .5rem;
  }
  nav a:last-child::after {
    content: "";
  }
  main {
    max-width: var(--max);
    margin: 2rem auto;
    padding: 0 1rem;
  }
  article {
    border: 2px solid var(--fg);
    padding: 1rem;
    margin-bottom: 2rem;
    background: #fff;
  }
  article h2 {
    font-size: 2rem;
    margin-top: 0;
  }
  .date {
    font-size: .85rem;
    text-transform: uppercase;
    font-weight: bold;
    margin-bottom: .5rem;
    color: var(--accent);
  }
</style>
</head>
<body>
<header>
  <h1>My Chunky Retro Tech Blog</h1>
  <nav>
    #Home</a>
    #Archive</a>
    #About</a>
  </nav>
</header>

<main>
  <article>
    <div class="date">Feb 2026</div>
    <h2>Why I Love Old-School Tech Aesthetics</h2>
    <p>Looks like 2004, performs like 2026.</p>
  </article>
</main>

</body>
</html>
